        />

        />

            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>

        <title>HdP | Nuestras Mascotas</title>
    </head>
    <body>
        <!-- BARRA DE NAVEGACION -->
        <nav class="navegacion navbar navbar-expand-lg">
            <div class="container">
                <!-- LOGO -->
                <a class="navbar-brand" href="inicio.html"> Huellas del Puerto </a>
                <!-- BOTON -->
                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>
                <!-- NAVEGACION -->
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="inicio.html">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="mascotas.html">Mascotas</a>
                        </li>

                            <a class="nav-link" href="adopcion.html">Adopción</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        <!-- FIN BARRA DE NAVEGACION -->

        <!-- TITULO -->
        <section class="adopcion-titulo">
            <div class="container text-center padtopbottom">
                <h1>Solicitud de adopción</h1>
                <p>Completa el formulario para iniciar tu proceso de adopción.</p>
            </div>
        </section>

        <!-- FORMULARIO -->
        <section class="adopcion-formulario">
            <div class="container padtopbottom">
                <form>
                    <div class="row">
                        <!-- NOMBRE -->
                        <div class="col-12 paddingtop">
                            <label for="nombre" class="form-label"><strong>Nombre completo</strong></label>
                            <input type="text"
                                class="form-control"
                                id="nombre"
                                name="nombre"
                                required>
                        </div>
                        <!-- CORREO -->
                        <div class="col-12 col-md-6 paddingtop">
                            <label for="correo" class="form-label"><strong>Correo electrónico</strong></label>
                            <input type="email" class="form-control" id="correo"name="correo" required>
                        </div>
                        <!-- TELEFONO -->
                        <div class="col-12 col-md-6 paddingtop">
                            <label for="telefono" class="form-label"><strong>Teléfono</strong></label>
                            <input type="tel" class="form-control" id="telefono" name="telefono" required>
                        </div>
                        <!-- MASCOTA -->
                        <div class="col-12">
                            <label for="mascota" class="form-label"><strong>Mascota de interés</strong></label>
                            <select class="form-select" id="mascota" name="mascota" required>
                                <option value="max">Max</option>
                                <option value="rocky">Rocky</option>
                                <option value="jose-pedro">José Pedro</option>
                                <option value="milo">Milo</option>
                                <option value="simba">Simba</option>
                                <option value="nala">Nala</option>
                            </select>
                        </div>
                        <!-- EDAD -->
                        <div class="col-12">
                            <label for="edad" class="form-label"><strong>Edad</strong></label>
                            <input type="number" class="form-control" id="edad" name="edad" min="18" required>
                        </div>
                        <!-- TIPO DE VIVIENDA -->
                        <div class="col-12 col-md-6">
                            <label class="form-label"><strong>Tipo de vivienda</strong></label>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="vivienda" id="casa" value="casa" required>
                                <label class="form-check-label" for="casa">Casa</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="vivienda" id="departamento" value="departamento">
                                <label class="form-check-label" for="departamento">Departamento</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="vivienda" id="otro" value="otro">
                                <label class="form-check-label" for="otro">Otro</label>
                            </div>
                        </div>
                        <!-- OTROS ANIMALES -->
                        <div class="col-12 col-md-6">
                            <label class="form-label"><strong>¿Tienes otros animales?</strong></label>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="otros-animales" id="animales-si" value="si" required>
                                <label class="form-check-label" for="animales-si">Sí</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="otros-animales" id="animales-no" value="no">
                                <label class="form-check-label" for="animales-no">No</label>
                            </div>
                        </div>
                        <!-- MOTIVO -->
                        <div class="col-12">
                            <label for="motivo" class="form-label"><strong>¿Por qué quieres adoptar?</strong></label>
                            <textarea class="form-control" id="motivo" name="motivo" rows="5"required></textarea>
                        </div>
                        <!-- COMPROMISO -->
                        <div class="col-12 col-md-6 form-check padtopbottom">
                            <input class="form-check-input" type="checkbox" id="responsable" name="responsable" required>
                            <label class="form-check-label" for="responsable">
                                Acepto el compromiso de tenencia responsable de la mascota.
                            </label>
                        </div>
                        <!-- ENVIAR -->
                        <div class="col-12 col-md-6 text-center padtopbottom">
                            <button type="submit" class="btn btn-primary"> Enviar solicitud</button>
                        </div>
                    </div>

                </form>
            </div>
        </section>

        <!--IMAGEN -->
        <section class="adopcion-imagen">
            <div class="container-fluid centered">
                <img src="../media/bienvenida.png" class="img-fluid">
            </div>
        </section>
        <!-- FOOTER -->
        <section class="footer">
            <footer>
                <div class="container padtopbottom">
                    <div class="row align-items-center">
                        <div class="col-12 col-md-6">
                            <h4>Huellas del Puerto</h4>
                            <p>Rescate y adopción responsable</p>
                        </div>
                        <div class="col-12 col-md-6 text-md-end">
                            <a href="#"><i class="bi bi-instagram"></i></a>
                            <a href="#" class="ms-2"><i class="bi bi-facebook"></i></a>
                            <a href="#" class="ms-2"><i class="bi bi-whatsapp"></i></a>
                        </div>
                    </div>
                </div>
            </footer>
        </section>
    </body>
</html>
